name: ACPI Index Update

on:
  schedule:
    - cron: '0 * * * *'    # every hour on the hour
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-acpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pandas pyarrow

      - name: Run ACPI calculation
        run: python acpi.py

      - name: Commit updated data files
        run: |
          git config user.name  "tokenix-bot"
          git config user.email "bot@tokenix.ai"
          git add dashboard/data/acpi_latest.json
          git add dashboard/data/acpi_history.csv
          git diff --staged --quiet || git commit -m "chore: acpi update $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Push changes
        run: git push